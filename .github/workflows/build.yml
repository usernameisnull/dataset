name: Release

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: true
        default: 'main'
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login Github Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/dataset-controller
          tags: |
            ${{ github.event.inputs.version || (github.ref == 'refs/heads/main' && 'latest' || github.ref_name) }}

      - name: Build Manager
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Docker meta
        id: meta_loader
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/dataset-data-loader
          tags: |
            ${{ github.event.inputs.version || (github.ref == 'refs/heads/main' && 'latest' || github.ref_name) }}

      - name: Build Data Loader
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          file: data-loader.Dockerfile
          provenance: false
          tags: ${{ steps.meta_loader.outputs.tags }}
          labels: ${{ steps.meta_loader.outputs.labels }}
  publish-chart:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [ build-and-push ]
    permissions:
      contents: write
    env:
      HELM_CHARTS_DIR: manifests/dataset
      HELM_CHART_NAME: dataset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Checkout GH-Pages Branch (为了保留旧版本)
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: old-gh-pages
        continue-on-error: true # 第一次运行时分支不存在，防止报错

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Get the version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=${{ github.event.inputs.version }}
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "SEMVER=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Prepare Helm Chart
        run: |
          # 1. 注入 CRD 和版本号
          cp -rf config/crd/bases/* $HELM_CHARTS_DIR/templates/ || true
          sed -i "s/tag: .*/tag: ${{ steps.get_version.outputs.VERSION }}/g" $HELM_CHARTS_DIR/values.yaml
          sed -i "s/version: .*/version: ${{ steps.get_version.outputs.SEMVER }}/g" $HELM_CHARTS_DIR/Chart.yaml
          
          # 2. 准备发布目录
          mkdir -p ./publish-dir
          # 如果之前有旧文件，先复制过来（实现增量更新）
          if [ -d "old-gh-pages" ]; then
            cp -r old-gh-pages/* ./publish-dir/
          fi
          
          # 3. 打包新版本
          helm package $HELM_CHARTS_DIR --destination ./publish-dir/
          
          # 4. 重新生成索引
          helm repo index ./publish-dir/ --url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish-dir
          publish_branch: gh-pages
          force_orphan: false # 保持历史记录
