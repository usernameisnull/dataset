name: Release

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*.*.*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login Github Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/dataset-controller
          tags: |
            ${{ github.ref == 'refs/heads/main' && 'latest' || github.ref_name }}

      - name: Build Manager
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Docker meta
        id: meta_loader
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/dataset-data-loader
          tags: |
            ${{ github.ref == 'refs/heads/main' && 'latest' || github.ref_name }}

      - name: Build Data Loader
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          file: data-loader.Dockerfile
          provenance: false
          tags: ${{ steps.meta_loader.outputs.tags }}
          labels: ${{ steps.meta_loader.outputs.labels }}
  publish-chart:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-and-push ]
    permissions:
      contents: write
    env:
      HELM_CHARTS_DIR: manifests/dataset
      HELM_CHART_NAME: dataset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Get the version
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Tag helm chart image and copy crds
        run: |
          cp -rf config/crd/bases/* $HELM_CHARTS_DIR/templates/
          image_tag=${{ steps.get_version.outputs.VERSION }}
          chart_version=${{ steps.get_version.outputs.VERSION }}
          sed -i "s/latest/${image_tag}/g" $HELM_CHARTS_DIR/values.yaml
          chart_smever=${chart_version#"v"}
          sed -i "s/0.1.0/${chart_smever}/g" $HELM_CHARTS_DIR/Chart.yaml

      - name: Configure git for GitHub Pages
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Prepare Helm repository
        run: |
          # 创建一个临时目录来存放 Helm charts
          mkdir -p ./charts-repo
          # 打包 Helm Chart
          helm package $HELM_CHARTS_DIR --destination ./charts-repo/
          # 生成 Helm index 文件
          helm repo index ./charts-repo/ --url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Deploy Helm Charts to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./charts-repo
          publish_branch: gh-pages
